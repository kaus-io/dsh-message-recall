name: release

# 发布 GitHub Release 时，用该 release 的 tag 校验清单版本，再按版本号推导 dist-tag 发到 npm。
# 同一版本重复触发时视为发布完成并成功结束（幂等重发）。
#
# Publishing a GitHub Release validates its tag against the manifest version and
# then publishes to npm with the dist-tag derived from that version. Re-running
# the same version is a successful no-op.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build tooling
        run: pnpm run build:tools

      - name: Versions agree
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: node scripts/check-versions.mjs --tag "${TAG}"

      - name: Typecheck
        run: pnpm run typecheck

      - name: Committed artifacts are current
        run: node scripts/build.mjs --check

      - name: Tests
        run: pnpm test

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm; treating the release as complete."
            exit 0
          fi
          tag="$(node scripts/dist-tag.mjs)"
          echo "publishing ${name}@${version} with dist-tag ${tag}"
          npm publish --tag "${tag}"
